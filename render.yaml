services:
  - type: web
    name: banking-app-api
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        scope: build
      - key: FRONTEND_ORIGIN
        scope: build
      - key: JWT_SECRET
        scope: build
